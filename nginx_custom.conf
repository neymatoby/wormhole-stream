daemon off;
error_log /dev/stdout info;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application stream {
            live on;

            # === HLS Engine ===
            hls on;
            hls_path /opt/data/hls;

            # Fragment = 2s — larger fragments reduce request overhead
            # over Cloudflare tunnels, preventing buffer starvation
            # CRITICAL: OBS Keyframe Interval MUST match (set to 2s)
            hls_fragment 2s;

            # Playlist = 6s (3 x 2s fragments) — minimum for HLS spec
            # Player needs 2-3 fragments to start
            hls_playlist_length 6s;

            # Sequential naming prevents browser caching stale segments
            hls_fragment_naming sequential;

            # Continuous mode: don't reset segment numbering on reconnect
            hls_continuous on;

            # Cleanup old segments aggressively (prevent stale data)
            hls_cleanup on;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    access_log /dev/stdout combined;

    # Gzip for static assets only (NOT for HLS segments)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;

    server {
        listen 80;
        root /www/static/app;
        index index.html;

        # === RTMP Stats (JSON-parseable XML) ===
        # The player polls this to check if a stream is live
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            if ($request_method = 'OPTIONS') { return 204; }
        }
        location /stat.xsl {
            root /www/static;
        }

        # === HLS Segment Delivery ===
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /opt/data;

            # CRITICAL: No caching for live HLS — segments are ephemeral
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;

            # CORS for cross-origin player access (Cloudflare tunnel → GitHub Pages)
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Legacy /live path alias
        location /live {
            alias /opt/data/hls;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # === Static asset caching ===
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # === SPA fallback ===
        location /wormhole-stream/ {
            alias /www/static/app/;
            try_files $uri $uri/ /index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
