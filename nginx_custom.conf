daemon off;
error_log /dev/stdout info;
events { worker_connections 1024; }
rtmp {
    server {
        listen 1935;
        chunk_size 4000;
        application stream {
            live on;
            hls on;
            hls_fragment 2s;
            hls_playlist_length 8s;
            hls_path /opt/data/hls;
        }
    }
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    access_log /dev/stdout combined;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/vnd.apple.mpegurl;
    gzip_min_length 256;
    gzip_comp_level 6;
    server {
        listen 80;
        root /www/static/app;
        index index.html;
        location /hls {
            types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
            root /opt/data;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        location /live {
            alias /opt/data/hls;
            types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        location /stat { rtmp_stat all; rtmp_stat_stylesheet stat.xsl; }
        location /stat.xsl { root /www/static; }
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
