services:
  nginx-rtmp:
    build: .
    container_name: wormhole-backend
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP streaming port
      - "8080:80"     # HLS/HTTP + Frontend port
    volumes:
      # Persistent volume for HLS segments only
      - wormhole-hls-data:/opt/data/hls
    environment:
      - TZ=Africa/Lagos

volumes:
  wormhole-hls-data:
    driver: local
